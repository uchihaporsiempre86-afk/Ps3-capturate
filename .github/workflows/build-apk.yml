name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests (parser against golden stream)
        working-directory: Android
        run: ./gradlew testDebugUnitTest --no-daemon || gradle testDebugUnitTest --no-daemon

      - name: Build debug APK (signed with debug key, installable)
        working-directory: Android
        run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PS3Capture480-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
